<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Board</title>
<script>
// Runs before anything else. The old Kindle browser has no developer console, so any
// JavaScript error is shown in the status line at the bottom of the page.
window.legacyFatal = "";
window.onerror = function (msg, url, line) {
  window.legacyFatal = "JS error: " + msg + " (line " + line + ")";
  var s = document.getElementById("status");
  if (s) { s.className = "status err"; s.textContent = window.legacyFatal; }
  return false;
};
</script>
<style>
html, body { margin: 0; background: #0b0b0b; color: #e1dfd8; font-family: Helvetica, Arial, sans-serif; }
body { text-align: center; padding: 6px 0; }

/* ---- controls ---- */
.controls { margin: 4px 8px 8px; font-size: 14px; }
.controls label { color: #9a978d; margin-right: 4px; }
.controls select {
  background: #1c1c1c; color: #e1dfd8; border: 1px solid #3a3a3a;
  font-size: 14px; padding: 4px; margin: 0 4px; max-width: 60%;
}
body.kiosk .controls { display: none; }

/* ---- status ---- */
.status { font-size: 13px; color: #8a8570; margin-top: 8px; min-height: 16px; }
.status.warn { color: #e0a040; }
.status.err  { color: #e06050; }

/* ---- shared ---- */
.board { display: inline-block; text-align: left; }

/* ---- flap style (static: no flip animation) ----
   Everything inside is sized in em. legacy.js sets the font-size of #flapBoard
   so the whole board scales to the screen. */
#flapBoard {
  background: #141414; padding: .6em; border-radius: .3em;
  border: .08em solid #2a2a2a;
}
.title, .row { white-space: nowrap; line-height: 0; }
.title { height: 1.5em; margin-bottom: .4em; }
.row { height: 1.5em; margin-bottom: .22em; }
.colheads { height: .45em; line-height: .45em; margin-bottom: .2em; white-space: nowrap; }
.colheads .h { display: inline-block; vertical-align: top; }
.colheads small { font-size: .3em; letter-spacing: .12em; color: #8a8570; }
.h-ln { width: 2.74em; }
.h-car { width: 1.62em; }
.h-dest { width: 20.66em; }
.h-min { width: 3.24em; text-align: right; }

.group { display: inline-block; vertical-align: top; margin-right: .5em; }
.cell {
  display: inline-block; vertical-align: top; position: relative;
  width: 1em; height: 1.5em; margin-right: .12em;
  background: #1c1c1c; color: #e1dfd8; border-radius: .1em;
  text-align: center; overflow: hidden;
}
.cell span { display: block; font-size: 1.23em; line-height: 1.22; font-weight: bold; }
/* lower half is a little darker, like the lower flap */
.cell b { position: absolute; left: 0; right: 0; top: 50%; bottom: 0; background: rgba(0,0,0,.18); }
/* the hinge line */
.cell i { position: absolute; left: 0; right: 0; top: 50%; height: 1px; margin-top: -1px; background: #050505; }

.ln-RD .cell { background: #b3202a; }
.ln-BL .cell { background: #1a5bb5; }
.ln-OR .cell { background: #d9791c; }
.ln-YL .cell { background: #d8b800; }
.ln-YL .cell span { color: #1a1a1a; }
.ln-GR .cell { background: #1e8f4e; }
.ln-SV .cell { background: #9ba0a6; }
.ln-SV .cell span { color: #151515; }

/* ---- LED style (simplified: amber text on black, no canvas) ----
   To remove the soft glow, delete the two text-shadow lines below. */
#ledBoard {
  background: #050505; padding: .5em; border: .1em solid #2a2a2a;
  font-family: "Courier New", Courier, monospace; font-weight: bold;
  white-space: pre; line-height: 1.05; display: none;
}
#ledBoard div { height: 1.05em; }
#ledBoard .gap { height: .12em; }
#ledBoard span { text-shadow: 0 0 .25em currentColor; }
.am { color: #ffae00; }
.hd { color: #ff2a1d; }
.cy { color: #ffe21a; }
.cg { color: #27ff4f; }
.l-RD { color: #ff2d2d; }
.l-BL { color: #2f6bff; }
.l-OR { color: #ff7a00; }
.l-YL { color: #ffd60a; }
.l-GR { color: #1fe060; }
.l-SV { color: #cfd6e2; }
</style>
</head>
<body>
<div class="controls" id="controls">
  <label for="station">Station</label>
  <select id="station"><option>Loading stations...</option></select>
  <select id="style">
    <option value="flap">Flaps</option>
    <option value="led">LED</option>
  </select>
</div>

<div class="board" id="flapBoard">
  <div class="title" id="flapTitle"></div>
  <div class="colheads"><span class="h h-ln"><small>LN</small></span><span class="h h-car"><small>CAR</small></span><span class="h h-dest"><small>DESTINATION</small></span><span class="h h-min"><small>MIN</small></span></div>
  <div id="flapRows"></div>
</div>

<div class="board" id="ledBoard"></div>

<div class="status" id="status">Starting... (if this stays, legacy.js did not load)</div>

<script src="legacy.js"></script>
</body>
</html>
